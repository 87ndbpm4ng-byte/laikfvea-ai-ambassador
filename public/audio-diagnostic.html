<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Audio playback diagnostic</title>
  </head>
  <body>
    <button id="request-and-play">Request and play</button>
    <button id="play-prepared" disabled>Play prepared audio</button>
    <pre id="log"></pre>
    <script>
      const output = document.querySelector("#log");
      const playPrepared = document.querySelector("#play-prepared");
      const events = [
        "loadstart",
        "loadedmetadata",
        "canplay",
        "canplaythrough",
        "play",
        "playing",
        "pause",
        "ended",
        "error",
      ];
      let preparedAudio;
      let preparedUrl;

      function log(label, details = {}) {
        const entry = `${label} ${JSON.stringify(details)}`;
        output.textContent += `${entry}\n`;
        console.info("[audio-diagnostic]", label, details);
      }

      function observe(audio, objectUrl) {
        for (const eventName of events) {
          audio.addEventListener(eventName, () => {
            log(eventName, {
              src: audio.src,
              sourceMatchesObjectUrl: audio.src === objectUrl,
              readyState: audio.readyState,
              networkState: audio.networkState,
              errorCode: audio.error?.code ?? null,
              errorMessage: audio.error?.message ?? null,
            });
          });
        }
      }

      async function requestAudio() {
        const response = await fetch("/api/speech", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: "This is a Daniel audio playback diagnostic.",
            guideId: "daniel",
            language: "en-GB",
          }),
        });
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const audio = new Audio(objectUrl);
        observe(audio, objectUrl);
        log("response", {
          status: response.status,
          headerMimeType: response.headers.get("content-type"),
          blobMimeType: blob.type,
          provider: response.headers.get("x-speech-provider"),
          bytes: blob.size,
          objectUrl,
          audioSource: audio.src,
          mp3Support: audio.canPlayType("audio/mpeg"),
        });
        return { audio, objectUrl };
      }

      requestAudio().then(async ({ audio, objectUrl }) => {
        preparedAudio = audio;
        preparedUrl = objectUrl;
        playPrepared.disabled = false;
        log("prepared");
        try {
          log("awaiting-automatic-play", { objectUrl });
          await audio.play();
          log("automatic-play-fulfilled", { objectUrl });
        } catch (error) {
          log("automatic-play-rejected", {
            name: error.name,
            message: error.message,
            mediaErrorCode: audio.error?.code ?? null,
            mediaErrorMessage: audio.error?.message ?? null,
          });
        }
      });

      document
        .querySelector("#request-and-play")
        .addEventListener("click", async () => {
          const { audio, objectUrl } = await requestAudio();
          try {
            log("awaiting-play", { objectUrl });
            await audio.play();
            log("play-fulfilled", { objectUrl });
          } catch (error) {
            log("play-rejected", {
              name: error.name,
              message: error.message,
              mediaErrorCode: audio.error?.code ?? null,
              mediaErrorMessage: audio.error?.message ?? null,
            });
          }
        });

      playPrepared.addEventListener("click", async () => {
        try {
          log("awaiting-prepared-play", { objectUrl: preparedUrl });
          await preparedAudio.play();
          log("prepared-play-fulfilled", { objectUrl: preparedUrl });
        } catch (error) {
          log("prepared-play-rejected", {
            name: error.name,
            message: error.message,
            mediaErrorCode: preparedAudio.error?.code ?? null,
            mediaErrorMessage: preparedAudio.error?.message ?? null,
          });
        }
      });
    </script>
  </body>
</html>
